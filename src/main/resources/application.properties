spring.application.name=Spring-Producer-Consumer
spring.kafka.bootstrap-servers=localhost:9091,localhost:9092,localhost:9093
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer


# Delivery Guarantee Demo Configuration
kafka.delivery.topic.name=delivery-guarantee-demo
kafka.delivery.at-most-once.enabled=true
kafka.delivery.at-least-once.enabled=true
kafka.delivery.exactly-once.enabled=true

#Setup port for this Spring application
server.port=8088